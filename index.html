<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Differentiation Explorer - Robust Version</title>
    <!-- We use a different, very stable CDN for Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        .container { background: white; padding: 20px; border-radius: 12px; width: 95%; max-width: 1100px; margin: 10px auto; flex: 1; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
        .group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
        input[type="text"] { padding: 8px; border: 2px solid #3b82f6; border-radius: 6px; font-size: 1rem; }
        .plot-box { flex: 1; position: relative; border: 1px solid #e2e8f0; border-radius: 8px; background: white !important; }
        #plot-area { width: 100%; height: 100%; min-height: 400px; }
        #math-label { position: absolute; background: white; border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; pointer-events: none; z-index: 100; font-style: italic; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; background: #0f172a; color: white; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; margin-top: 10px; }
        button { padding: 8px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        .btn-blue { background: #3b82f6; } .btn-gray { background: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div class="group">
            <label>Function f(x)</label>
            <input type="text" id="equation" value="x^2">
        </div>
        <div class="group">
            <label>Point A (x) = <span id="x-disp">6.0</span></label>
            <input type="range" id="x-slider" min="-50" max="50" step="0.1" value="6">
        </div>
        <div class="group">
            <label>Distance Δx = <span id="h-disp">7.701</span></label>
            <input type="range" id="h-slider" min="0.001" max="15" step="0.01" value="7.7">
        </div>
        <div class="group">
            <label>Options</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-blue" onclick="render('focus')">Focus</button>
                <button class="btn-gray" onclick="render('reset')">Reset</button>
            </div>
            <label style="text-transform:none; margin-top:5px;"><input type="checkbox" id="show-tri" checked> Show Rise/Run</label>
        </div>
    </div>

    <div class="plot-box">
        <div id="plot-area"></div>
        <div id="math-label" style="display:none"></div>
    </div>

    <div class="stats">
        <div>Secant Slope: <span id="s-val" style="color:#fb923c">--</span></div>
        <div>Tangent Slope: <span id="t-val" style="color:#38bdf8">--</span></div>
    </div>
</div>

<script>
    let isInit = false;
    let xRange = [-10, 10], yRange = [-10, 10];

    function render(mode = "keep") {
        const eqStr = document.getElementById('equation').value;
        const xA = parseFloat(document.getElementById('x-slider').value);
        const h = parseFloat(document.getElementById('h-slider').value);
        const xB = xA + h;

        document.getElementById('x-disp').innerText = xA.toFixed(1);
        document.getElementById('h-disp').innerText = h.toFixed(3);

        try {
            const f = math.compile(eqStr);
            const df = math.derivative(eqStr, 'x').compile();
            const yA = f.evaluate({x: xA});
            const yB = f.evaluate({x: xB});
            const slopeS = (yB - yA) / h;
            const slopeT = df.evaluate({x: xA});

            document.getElementById('s-val').innerText = slopeS.toFixed(3);
            document.getElementById('t-val').innerText = slopeT.toFixed(3);

            if (mode === "reset") { xRange = [-10, 10]; yRange = [-10, 10]; }
            else if (mode === "focus") {
                xRange = [Math.min(xA, xB) - 10, Math.max(xA, xB) + 10];
                yRange = [Math.min(yA, yB) - 20, Math.max(yA, yB) + 20];
            } else if (isInit) {
                xRange = document.getElementById('plot-area').layout.xaxis.range;
                yRange = document.getElementById('plot-area').layout.yaxis.range;
            }

            const xs = [], ys = [];
            for (let x = xRange[0]-5; x <= xRange[1]+5; x += (xRange[1]-xRange[0])/200) {
                xs.push(x); ys.push(f.evaluate({x}));
            }

            const data = [
                { x: xs, y: ys, name: 'f(x)', line: {color: '#1e293b', width: 3} },
                { x: [-1000, 1000], y: [-1000, 1000].map(x => slopeS*(x-xA)+yA), name: 'Secant', line: {color: '#fb923c', dash: 'dash'} },
                { x: [-1000, 1000], y: [-1000, 1000].map(x => slopeT*(x-xA)+yA), name: 'Tangent', line: {color: '#38bdf8', width: 2} }
            ];

            if (document.getElementById('show-tri').checked) {
                data.push({ x: [xA, xB, xB], y: [yA, yA, yB], mode: 'lines', line: {color: '#fb923c', width: 2, dash: 'dot'}, showlegend: false });
            }

            data.push({ x: [xA, xB], y: [yA, yB], mode: 'markers+text', text: ['A', 'B'], textposition: 'top center', marker: {color: ['black', '#fb923c'], size: 10}, showlegend: false });

            const layout = {
                xaxis: { range: xRange, gridcolor: '#eee', zerolinecolor: '#444' },
                yaxis: { range: yRange, gridcolor: '#eee', zerolinecolor: '#444' },
                margin: { t: 30, b: 30, l: 50, r: 20 },
                paper_bgcolor: 'white', plot_bgcolor: 'white',
                dragmode: 'pan', showlegend: true, legend: { orientation: 'h', y: 1.1 }
            };

            Plotly.react('plot-area', data, layout, { responsive: true, scrollZoom: true, displayModeBar: false });
            isInit = true;

            // Position Label
            const plot = document.getElementById('plot-area');
            const label = document.getElementById('math-label');
            const xPx = plot._fullLayout.xaxis.l2p(xA) + plot._fullLayout.margin.l;
            const yPx = plot._fullLayout.yaxis.l2p(yA) + plot._fullLayout.margin.t;
            if (xPx > 0 && xPx < plot.offsetWidth) {
                label.style.display = 'block'; label.style.left = (xPx+10)+'px'; label.style.top = (yPx-40)+'px';
                label.innerHTML = `y = ${eqStr.replace('^', '<sup>')}</sup>`;
            } else { label.style.display = 'none'; }

        } catch (e) { console.log("Equation error"); }
    }

    ['equation', 'x-slider', 'h-slider'].forEach(id => document.getElementById(id).oninput = () => render());
    document.getElementById('show-tri').onchange = () => render();
    
    // Fix for local loading
    window.onload = () => setTimeout(() => render("focus"), 500);
</script>

</body>
</html>
